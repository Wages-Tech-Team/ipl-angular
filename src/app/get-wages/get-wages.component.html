<div [ngClass]="{'loading-css' : this.service.showloader}" class="backGround" >
        <!-- <span class="backoption" (click)="navigatedTo()"> Back</span> -->
        <div class="d-flex justify-content-center align-item-center" style="background-color: dodgerblue;">
            <span class="projectHeading">INTERIOR PARTNERSHIPS LTD</span>
        </div>
        <div class="p-4">
        <p-confirmDialog [style]="{ width: '20vw',background:'white' }" [baseZIndex]="10000">
            <ng-template pTemplate="footer">
                <div *ngIf="this.downloadWages">

                </div>
                <button type="button" pButton icon="pi pi-times" label="Cancel" (click)="reject()" *ngIf="((this.modalHeading == 'Error') && (!this.downloadWages))"></button>
                <button type="button" pButton icon="pi pi-times" label="No" (click)="reject()" *ngIf="((this.modalHeading != 'Error') && (!this.downloadWages))"></button>
                <button type="button" pButton icon="pi pi-check" label="Yes" (click)="accept()" *ngIf="((this.modalHeading != 'Error') && (!this.downloadWages))"></button>
            </ng-template>
        </p-confirmDialog>
        <div class="mt-4 inner-card">
            <!-- <div class="container"> -->
                <div class="d-flex">
                    <button class="finalSubmit" (click)="downloadWagesModal(selectDateModal)">Download Orders</button>
                    <button class="wagesReport" (click)="navigatedTowagesReport()">Recent Orders</button>
                <!-- </div> -->
                <!-- <div class="d-flex justify-content-end"> -->
                    <button class="finalSubmitSecond" *ngIf="this.wagesReport" (click)="confirm('Are you sure you want to final submit the order ?','Final Submit',null)">Final Submission</button>
                </div>
            <!-- </div> -->
           
            <div class="mt-4 table-body">
                <p-table [columns]="column" [value]="data" [responsive]="false" [paginator]='true' [alwaysShowPaginator]="false" [(first)]='first' [rows]='10' [totalRecords]='this.totalRecords'>
                    <ng-template pTemplate="header" let-columns>
                        <tr class="row-background-color2">
                            <th *ngFor="let col of columns; let i = index" class="color-grey font22" [ngClass]="{'w-20':i==0,'w-15':(i==8 || i==4),'w-10': (i!=0 && i !=8 && i!=4)}">
                                <span>{{col.header}}</span>
                            </th>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="body" let-rowData let-columns="columns" let-row="rowIndex" [formGroup]="this.editForm">
                        <tr>
                            <td *ngFor="let col of columns; let i = index">
                                <span *ngIf="i != 8 && i !=10"> {{rowData[col.field] ? rowData[col.field] : "-"}} </span>
                                <span *ngIf="i==8 && !this.editOption[row]"> {{this.service.formatNumber(number(rowData[col.field])?.toFixed(2))}}</span>
                                <span *ngIf="i==8 && this.editOption[row]"><input type="text" class="w-100" formControlName="amount" (input)="amountCheck(row)"></span>
                                <p *ngIf="i==8 && this.editOption[row] && this.errorMessage[row]" class="error mb-0 font11">Amount Should be less than Remaining Amount.</p>
                                <div *ngIf="i==10 && this.editAndDeletePermission == 1" class="d-flex boxStyle">
                                <button class="editOption" *ngIf="!this.editOption[row]" (click)="editDetail(row)">Edit</button>
                                <button class="delete mt-2" *ngIf="!this.editOption[row]" (click)="confirm('Are you sure you want to delete the order ?','Delete Order',row)">Delete</button>
                                <button class="editOption" *ngIf="this.editOption[row]" (click)="confirm('Are you sure you want to save the order ?','Save Order',null)">Save</button>
                                <button class="delete mt-2" *ngIf="this.editOption[row]" (click)="this.editOption[row] = false">X</button>
                                </div>
                            </td>
                        </tr>
                    </ng-template>
                </p-table>
                <div class="d-flex justify-content-center align-item-center p-4 borderBox" *ngIf="this.data.length == 0">
                    <td>
                        <span class="color-grey">No Results Found</span>
                    </td>
                </div>
            </div>
            <!-- <div class="d-flex justify-content-end">
                <span class="sub-total">Total :</span>
                <span class="sub-total-value"> {{this.subTotal}}</span>
            </div> -->
        </div>
    </div>
</div>


<ng-template #selectDateModal let-modal>
    <div class="modalBg id_head" >
        <div class="id_heading">
                Please Select Date
        </div>
        <div class="font15"> Booking Date :</div>
            <div class="wagesDate" [formGroup]="downloadWagesForm">
                <p-calendar [(ngModel)]="dateFromValue" [defaultDate]="this.currentDate" [minDate]="this.dobminDate" [maxDate]="this.currentDate"
                    dateFormat="dd-mm-yy" formControlName="wages_date" timezone="utc"  [showIcon]="true" class="date-input">
                </p-calendar>
            </div>
        <div class="d-flex justify-content-center butSpecs mt-4 ml-3 p-0">
            <button type="button" class="font-fam cancel_grey" (click)="canceldownloadWagesModal()">Cancel</button>
            <button type="button" class="font-fam submitProcess" (click)="download()" style="margin-left: 10px;">Download</button>
        </div>
    </div>
</ng-template>
